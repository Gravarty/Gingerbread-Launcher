plugins { id "com.android.application" }

// Port: the Nexus live wallpaper as its own APK, so launcher updates don't reset it
android {
    namespace "com.android.wallpaper.nexus"
    compileSdk 37

    defaultConfig {
        applicationId "com.gravarty.wallpaper.nexus"
        minSdk 30
        targetSdk 37
        versionCode 1
        versionName "2.3.7"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false }
    sourceSets {
        main { res.srcDir "src/nexus/res" } // this variant's background and thumbnail
    }
}
