plugins { id "com.android.application" }

// Port: the Nexus S variant of the Nexus live wallpaper as its own APK
android {
    namespace "com.android.wallpaper.nexus"
    compileSdk 37

    defaultConfig {
        applicationId "com.gravarty.wallpaper.nexuss"
        minSdk 30
        targetSdk 37
        versionCode 1
        versionName "2.3.7"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false }
    sourceSets {
        main { // the code and common resources of :wallpaper-nexus
            java.srcDir "../wallpaper-nexus/src/main/java"
            res.srcDir "../wallpaper-nexus/src/main/res"
        }
    }
}
